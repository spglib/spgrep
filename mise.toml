[tasks.default]
description = "List available tasks"
run = "mise tasks"

[tasks.prek]
description = "Run pre-commit hooks"
run = "prek run --all-files"

[tasks.install]
description = "Install all dependencies"
run = "uv sync --all-extras"

[tasks.test]
description = "Run the test suite"
run = "uv run pytest -v"

[tasks.docs]
description = "Serve documentation with live reload"
run = [
  "uv run --extra docs python scripts/prepare_docs.py",
  "uv run --extra docs zensical serve",
]

[tasks.docs-build]
description = "Build documentation with strict validation"
run = [
  "uv run --extra docs python scripts/prepare_docs.py",
  "uv run --extra docs zensical build --clean --strict",
]
