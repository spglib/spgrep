name: testing

on:
  push:
    branches: [develop, rc]
  pull_request:
    branches: [develop]

env:
  PYTHON_VERSION: "3.13"

jobs:
  path-filter:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4
        with:
          filters: .github/filters.yaml

  tests:
    needs: path-filter
    if: ${{ needs.path-filter.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      with:
        fetch-depth: 0
    - name: Install uv
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      with:
        enable-cache: true
        python-version: ${{ matrix.python-version }}
    - name: Install
      run: |
        uv sync --extra testing
    - name: Test with pytest
      run: |
        uv run pytest -v --cov=spgrep --cov-report=xml tests/
    - name: Upload coverage to Codecov
      if: matrix.python-version == ${{ env.PYTHON_VERSION }}
      uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6
      with:
        file: ./coverage.xml
        flags: unittests
        fail_ci_if_error: false

  docs:
    needs: path-filter
    if: ${{ needs.path-filter.outputs.docs == 'true' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      with:
        fetch-depth: 0
    - name: Install uv
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      with:
        enable-cache: true
        python-version: ${{ env.PYTHON_VERSION }}
    - name: Install dependencies
      run: |
        sudo apt-get install -y pandoc
    - name: Install
      run: |
        uv sync --extra docs
    - name: Build
      run: |
        uv run sphinx-build docs docs_build
    # Generated documents are push to `gh-pages` branch
    # `ACTIONS_DEPLOY_KEY` is set by following: https://github.com/peaceiris/actions-gh-pages#%EF%B8%8F-create-ssh-deploy-key
    - name: Deploy
      if: ${{ github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags') }}
      uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e # v4
      with:
        deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
        publish_dir: ./docs_build

  pass:
    if: always()
    name: ✅ Pass tests
    needs: [tests, docs]
    runs-on: ubuntu-latest
    steps:
      - if: needs.tests.result == 'failure'
        run: exit 1
      - if: needs.docs.result == 'failure'
        run: exit 1
